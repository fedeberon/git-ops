name: Terraform validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/01-s3
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Install providers
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Authenticate to AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-terraform-plan
          aws-region: us-east-2
          allowed-account-ids: "603404126514"

      - name: Check AWS identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: aws sts get-caller-identity --no-cli-pager

      - name: Terraform plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform plan -input=false -no-color
