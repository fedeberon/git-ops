name: Terraform validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/01-s3
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Install providers
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Inspect OIDC claims
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          decoded = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          selected = {key: decoded.get(key) for key in ("iss", "aud", "sub", "repository", "ref")}
          print(json.dumps(selected, indent=2))
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Authenticate to AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-terraform-plan
          aws-region: us-east-2
          allowed-account-ids: "603404126514"

      - name: Check AWS identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: aws sts get-caller-identity --no-cli-pager

      - name: Initialize remote state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform plan -input=false -no-color
