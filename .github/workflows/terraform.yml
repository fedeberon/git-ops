name: Terraform validation

concurrency:
  group: terraform-s3-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: labs/01-s3
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Install providers
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Authenticate to AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-terraform-plan
          aws-region: us-east-2
          allowed-account-ids: "603404126514"

      - name: Check AWS identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: aws sts get-caller-identity --no-cli-pager

      - name: Initialize remote state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        id: plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=deployment.tfplan
          status=$?
          set -e
          case "$status" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Save reviewed plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: labs/01-s3/deployment.tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply approved plan
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.has_changes == 'true'
    environment: lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/01-s3
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: Authenticate deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-terraform-apply
          aws-region: us-east-2
          allowed-account-ids: "603404126514"

      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly

      - name: Download reviewed plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: labs/01-s3

      - name: Apply reviewed plan
        run: terraform apply -input=false -no-color -lock-timeout=60s deployment.tfplan
