name: Scintilla · Publicación
run-name: "Scintilla · Publicación · ${{ github.ref_name }} · #${{ github.run_number }}-${{ github.run_attempt }}"

on:
  push:
    branches: [main]
    paths:
      - 'apps/scintilla/**'
      - '.github/workflows/scintilla.yml'
      - 'scripts/scintilla-image.mjs'
      - 'scripts/test/scintilla-image.test.mjs'
  pull_request:
    paths:
      - 'apps/scintilla/**'
      - '.github/workflows/scintilla.yml'
      - 'scripts/scintilla-image.mjs'
      - 'scripts/test/scintilla-image.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scintilla-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: scintilla
  REGISTRY: 603404126514.dkr.ecr.us-east-2.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/scintilla
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/scintilla/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify image version rules
        run: node --test ../../scripts/test/scintilla-image.test.mjs

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCINTILLA_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-scintilla-publish
          aws-region: us-east-2
          allowed-account-ids: '603404126514'
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable date-execution image
        run: node scripts/scintilla-image.mjs publish
