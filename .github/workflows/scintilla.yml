name: Scintilla · CI y candidatos
run-name: "Scintilla · ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/rc-') && 'Construyendo imagen y subiendo a ECR' || 'Ejecutando pruebas' }} · ${{ github.ref_name }} · #${{ github.run_number }}-${{ github.run_attempt }}"

on:
  push:
    branches: [develop, main, 'release/rc-*']
    paths:
      - 'apps/scintilla/**'
      - '.github/workflows/scintilla.yml'
      - 'scripts/scintilla-image.mjs'
      - 'scripts/gitflow-policy.mjs'
      - 'scripts/scintilla-deploy.mjs'
      - '.github/workflows/scintilla-deploy.yml'
      - 'scripts/test/**'
      - 'labs/02-ec2-docker/deploy-container.sh'
      - 'labs/02-ec2-docker/user-data.sh'
  pull_request:
    paths:
      - 'apps/scintilla/**'
      - '.github/workflows/scintilla.yml'
      - 'scripts/scintilla-image.mjs'
      - 'scripts/gitflow-policy.mjs'
      - 'scripts/scintilla-deploy.mjs'
      - '.github/workflows/scintilla-deploy.yml'
      - 'scripts/test/**'
      - 'labs/02-ec2-docker/deploy-container.sh'
      - 'labs/02-ec2-docker/user-data.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scintilla-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: scintilla
  REGISTRY: 603404126514.dkr.ecr.us-east-2.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/scintilla
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/scintilla/package-lock.json
      - name: Check deployment shell syntax
        working-directory: .
        run: bash -n labs/02-ec2-docker/deploy-container.sh labs/02-ec2-docker/user-data.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify image version rules
        run: node --test ../../scripts/test/*.test.mjs

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/rc-') && github.event_name != 'pull_request' && vars.SCINTILLA_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify candidate branch before requesting AWS credentials
        run: node --input-type=module -e "import { isReleaseCandidate } from './scripts/gitflow-policy.mjs'; if (!isReleaseCandidate(process.env.GITHUB_REF)) process.exit(1);"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::603404126514:role/github-scintilla-publish
          aws-region: us-east-2
          allowed-account-ids: '603404126514'
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable date-execution image
        run: node scripts/scintilla-image.mjs publish
